name: Careforce
description: 'Careforce (Helpcare AI, Inc., d/b/a Careforce) provides an autonomous AI workforce
  platform for healthcare operations. Its AI agents — Angelica, a care coordinator handling
  preventive-care outreach, appointment scheduling, reminders, and referral management, and David,
  a data analyst that pulls and analyzes patient data across EHR and portal systems — integrate with
  30+ healthcare platforms including Epic, Cerner, Athenahealth, and NextGen to close care gaps and
  reduce staff workload. Backed by CRV. Careforce consumes third-party healthcare APIs rather than
  publishing a public developer API; no public developer portal, OpenAPI, or SDKs were found.'
